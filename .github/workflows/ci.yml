name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (frontend + backend + e2e)
        run: npm run lint

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          # Name must contain "test": backend/tests/helpers/db.js refuses to
          # truncate tables otherwise (safety net against a misconfigured
          # DATABASE_URL wiping a real database).
          POSTGRES_DB: booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking -d booking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Matches backend/src/db/pool.js, which prefers DATABASE_URL when set.
      # This service is a fresh, disposable container for this job only, so
      # backend/scripts/run-with-test-db.mjs's TEST_DATABASE_URL fallback
      # (used for local runs) is unnecessary here - it just passes this
      # DATABASE_URL through unchanged.
      DATABASE_URL: postgres://booking:booking@localhost:5432/booking_test
      JWT_SECRET: test-jwt-secret-do-not-use-in-production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests (runs migrations first via "pretest")
        run: npm test --workspace=backend

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test --workspace=frontend

  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Create .env for docker compose
        run: cp .env.example .env

      - name: Build and start the Docker Compose stack
        run: docker compose up --build -d

      - name: Run Playwright E2E suite
        run: npm run test:e2e

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down the Docker Compose stack
        if: always()
        run: docker compose down -v
