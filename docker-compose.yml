services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
      # NODE_ENV is intentionally left unset (not "production") here: the
      # backend marks its auth cookie Secure when NODE_ENV=production
      # (backend/src/routes/auth.js), which browsers refuse to store over
      # plain HTTP. This compose file has no TLS termination (that's added by
      # whatever reverse proxy sits in front of it in a real deployment), so
      # login over http://localhost would silently break if this were
      # "production".
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3000}:3000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      # Overlay the generic default logo/favicon baked into the image with a
      # custom one, without rebuilding. Point LOGO_FILE/FAVICON_FILE (in
      # .env) at your own files; unset falls back to the generic defaults.
      - ${LOGO_FILE:-./frontend/public/logo.default.svg}:/usr/share/nginx/html/logo.svg:ro
      - ${FAVICON_FILE:-./frontend/public/favicon.default.svg}:/usr/share/nginx/html/favicon.svg:ro

volumes:
  postgres-data:
