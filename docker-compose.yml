services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Isolated Postgres instance for local backend test runs, kept completely
  # separate from "db" (see backend/tests/helpers/db.js, which truncates
  # tables between tests - that must never hit the dev/prod database). Only
  # starts when explicitly requested via the "test" profile, never as part of
  # a plain `docker compose up`. No named volume: test data is disposable and
  # is gone once the container is removed.
  db-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-booking_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-booking_test}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-booking_test}
    ports:
      - "${TEST_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_POSTGRES_USER:-booking_test} -d ${TEST_POSTGRES_DB:-booking_test}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
      # Exactly one reverse-proxy hop sits in front of "backend" here: the
      # "frontend" nginx container (see frontend/nginx.conf). See app.js for
      # why this must match the real hop count exactly.
      TRUST_PROXY_HOPS: 1
      # NODE_ENV is intentionally left unset (not "production") here: the
      # backend marks its auth cookie Secure when NODE_ENV=production
      # (backend/src/routes/auth.js), which browsers refuse to store over
      # plain HTTP. This compose file has no TLS termination (that's added by
      # whatever reverse proxy sits in front of it in a real deployment), so
      # login over http://localhost would silently break if this were
      # "production".
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3000}:3000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      # Initial UI language before a user picks one via the language switch
      # (persisted in their browser after that). Applied at container start
      # by frontend/docker-entrypoint.d/40-locale-config.sh, since this is a
      # prebuilt static SPA and can't read process.env at runtime otherwise.
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      # Overlay the generic default logo/favicon baked into the image with a
      # custom one, without rebuilding. Point LOGO_FILE/FAVICON_FILE (in
      # .env) at your own files; unset falls back to the generic defaults.
      - ${LOGO_FILE:-./frontend/public/logo.default.svg}:/usr/share/nginx/html/logo.svg:ro
      - ${FAVICON_FILE:-./frontend/public/favicon.default.svg}:/usr/share/nginx/html/favicon.svg:ro

volumes:
  postgres-data:
